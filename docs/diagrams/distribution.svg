<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'JetBrains Mono','Courier New',monospace"><defs><marker id="et" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00D4AA"/></marker><marker id="st" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#00D4AA"/></marker><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#F59E0B"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#EF4444"/></marker></defs><rect width="1240" height="660" fill="#0D1B2A"/><text x="620.0" y="34" font-size="18" fill="#00D4AA" text-anchor="middle" font-weight="700">Ostraka · distribution</text><rect x="20" y="60" width="260" height="400" rx="10" fill="none" stroke="#00D4AA" stroke-opacity="0.3" stroke-width="1"/><text x="34" y="82" font-size="12" fill="#8FA3B8" text-anchor="start" font-weight="700">desktop apps · thin launchers</text><rect x="35" y="95" width="230" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="47" y="117" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">macOS · .dmg</text><text x="47" y="136" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">Swift WebKit window</text><text x="47" y="152" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">universal: arm64, x86_64</text><rect x="35" y="190" width="230" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="47" y="212" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Windows · .msi</text><text x="47" y="231" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">Edge in app mode,</text><text x="47" y="247" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">from Ostraka.ps1</text><rect x="35" y="285" width="230" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="47" y="307" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Linux · .deb or tarball</text><text x="47" y="326" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">Chromium, Chrome, Brave</text><text x="47" y="342" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">or Edge, in app mode</text><text x="35" y="400" font-size="11" fill="#8FA3B8" text-anchor="start" font-weight="400">no Ostraka logic inside;</text><text x="35" y="416" font-size="11" fill="#8FA3B8" text-anchor="start" font-weight="400">first launch: connect to a</text><text x="35" y="432" font-size="11" fill="#8FA3B8" text-anchor="start" font-weight="400">team, or run it here</text><rect x="320" y="60" width="400" height="400" rx="10" fill="none" stroke="#00D4AA" stroke-opacity="0.3" stroke-width="1"/><text x="334" y="82" font-size="12" fill="#8FA3B8" text-anchor="start" font-weight="700">local mode · this computer, needs Docker</text><rect x="335" y="95" width="370" height="96" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="347" y="117" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Host ostraka CLI</text><text x="347" y="136" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">./ostraka · ostraka-cli.ps1 on Windows</text><text x="347" y="152" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">start, stop, status --json, first-admin</text><text x="347" y="168" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">anything else → the backend's own CLI</text><rect x="335" y="221" width="370" height="96" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="347" y="243" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Docker Compose stack</text><text x="347" y="262" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">db, redis, backend, web</text><text x="347" y="278" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">compose project ostraka-app</text><text x="347" y="294" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">web on 127.0.0.1:24747 only</text><rect x="335" y="347" width="370" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="347" y="369" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">OSTRAKA_HOME</text><text x="347" y="388" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">~/Ostraka · %USERPROFILE%\Ostraka</text><text x="347" y="404" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">unpacked from the package, .ostraka-version</text><rect x="740" y="60" width="480" height="400" rx="10" fill="none" stroke="#00D4AA" stroke-opacity="0.3" stroke-width="1"/><text x="754" y="82" font-size="12" fill="#8FA3B8" text-anchor="start" font-weight="700">central mode · a team server</text><rect x="755" y="95" width="205" height="96" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="767" y="117" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">deploy/linux/install.sh</text><text x="767" y="136" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">copies to /opt/ostraka</text><text x="767" y="152" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">.env mode 600, secrets kept</text><text x="767" y="168" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">first admin's invitation</text><rect x="1000" y="95" width="205" height="96" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="1012" y="117" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">install-service.ps1</text><text x="1012" y="136" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">deploy/windows/</text><text x="1012" y="152" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">WSL 2 and Ubuntu, then</text><text x="1012" y="168" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">install.sh as root</text><rect x="755" y="221" width="450" height="96" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="767" y="243" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Compose stack · /opt/ostraka</text><text x="767" y="262" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">the same tree and stack as local mode</text><text x="767" y="278" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">Ostraka on 127.0.0.1:24747 only</text><text x="767" y="294" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">ostraka server init runs install.sh</text><rect x="755" y="347" width="450" height="96" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="767" y="369" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">HTTPS in front</text><text x="767" y="388" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">Caddy in the stack, optional: --caddy acme or internal</text><text x="767" y="404" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">or the team's own Caddy or nginx</text><text x="767" y="420" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">/ws upgraded, uploads up to 100 MB</text><rect x="755" y="520" width="205" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="767" y="542" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Browser</text><text x="767" y="561" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">the team, signed in with</text><text x="767" y="577" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">password + TOTP</text><rect x="1000" y="520" width="205" height="96" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="1012" y="542" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">ost · responder</text><text x="1012" y="561" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">clients/ost, ost.ps1</text><text x="1012" y="577" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">Bearer ost_… API token</text><text x="1012" y="593" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">declare, ioc, host, comment</text><rect x="35" y="520" width="420" height="110" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="47" y="542" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Releases · a v* tag</text><text x="47" y="561" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">tagged releases build on GitHub Actions</text><text x="47" y="577" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">.dmg .msi .deb + source, each with the source tree</text><text x="47" y="593" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">installed and removed on its own OS, SHA256SUMS</text><text x="47" y="609" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">make release builds the same files locally</text><path d="M280 143 L335 143" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="307.5" y="136" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">local</text><path d="M280 269 L335 269" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="307.5" y="262" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">window</text><path d="M520 191 L520 221" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="580" y="210" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">docker compose</text><path d="M520 347 L520 317" fill="none" stroke="#00D4AA" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#et)"/><text x="570" y="336" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">source tree</text><path d="M150 460 L150 480 L735 480 L735 395 L755 395" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="442.5" y="473" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">central: HTTPS · GET /api/meta</text><path d="M100 520 L100 460" fill="none" stroke="#00D4AA" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#et)"/><text x="135" y="500" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">packages</text><path d="M857 191 L857 221" fill="none" stroke="#00D4AA" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#et)"/><text x="900" y="210" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">sets up</text><path d="M1000 143 L960 143" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="980.0" y="136" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">WSL 2</text><path d="M980 347 L980 317" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="1050" y="336" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">127.0.0.1:24747</text><path d="M857 520 L857 443" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="890" y="485" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">HTTPS</text><path d="M1102 520 L1102 443" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="1135" y="485" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">HTTPS</text><line x1="490" y1="560" x2="518" y2="560" stroke="#00D4AA" stroke-width="2"/><text x="526" y="564" font-size="11" fill="#8FA3B8" text-anchor="start" font-weight="400">runs or calls</text><line x1="490" y1="578" x2="518" y2="578" stroke="#00D4AA" stroke-width="2" stroke-dasharray="6 4"/><text x="526" y="582" font-size="11" fill="#8FA3B8" text-anchor="start" font-weight="400">sets up or carries</text></svg>
