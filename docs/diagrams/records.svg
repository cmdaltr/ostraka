<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" font-family="'JetBrains Mono','Courier New',monospace"><defs><marker id="et" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00D4AA"/></marker><marker id="st" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#00D4AA"/></marker><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#F59E0B"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#EF4444"/></marker></defs><rect width="1240" height="590" fill="#0D1B2A"/><text x="620.0" y="34" font-size="18" fill="#00D4AA" text-anchor="middle" font-weight="700">Ostraka · records, phases and findings</text><rect x="20" y="60" width="1200" height="130" rx="10" fill="none" stroke="#00D4AA" stroke-opacity="0.3" stroke-width="1"/><text x="34" y="82" font-size="12" fill="#8FA3B8" text-anchor="start" font-weight="700">hunt  ·  HNT-YYYY-NNN</text><rect x="40" y="95" width="265" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="52" y="117" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Hypothesis</text><text x="52" y="136" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">what we expect to find,</text><text x="52" y="152" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">and where</text><rect x="335" y="95" width="265" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="347" y="117" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Collect</text><text x="347" y="136" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">searches run in Shikari,</text><text x="347" y="152" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">evidence in Rowanholt</text><rect x="630" y="95" width="265" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="642" y="117" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Analyse</text><text x="642" y="136" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">leads, not verdicts</text><rect x="925" y="95" width="265" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="937" y="117" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Conclude</text><text x="937" y="136" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">found something, or not</text><path d="M305 135 L335 135" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M600 135 L630 135" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M895 135 L925 135" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><rect x="20" y="230" width="1200" height="130" rx="10" fill="none" stroke="#00D4AA" stroke-opacity="0.3" stroke-width="1"/><text x="250" y="252" font-size="12" fill="#8FA3B8" text-anchor="start" font-weight="700">incident  ·  OST-YYYY-NNN</text><rect x="40" y="265" width="175" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="52" y="287" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Detect</text><text x="52" y="306" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">declared, roles set</text><rect x="238" y="265" width="175" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="250" y="287" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Scope</text><text x="250" y="306" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">assets, observables</text><rect x="436" y="265" width="175" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="448" y="287" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Contain</text><text x="448" y="306" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">stop the spread</text><rect x="634" y="265" width="175" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="646" y="287" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Eradicate</text><text x="646" y="306" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">remove the foothold</text><rect x="832" y="265" width="175" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="844" y="287" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Recover</text><text x="844" y="306" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">back to normal</text><rect x="1030" y="265" width="175" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="1042" y="287" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Learn</text><text x="1042" y="306" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">lessons, write-up</text><path d="M215 305 L238 305" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M413 305 L436 305" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M611 305 L634 305" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M809 305 L832 305" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M1007 305 L1030 305" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M1057 175 L1057 215 L127 215 L127 265" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#ea)"/><text x="590" y="208" font-size="10.5" fill="#F59E0B" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">promote: found something</text><rect x="20" y="395" width="1200" height="175" rx="10" fill="none" stroke="#00D4AA" stroke-opacity="0.3" stroke-width="1"/><text x="34" y="417" font-size="12" fill="#8FA3B8" text-anchor="start" font-weight="700">findings  ·  FND-N  ·  the reporting standard</text><rect x="40" y="440" width="250" height="90" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="52" y="462" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Lead</text><text x="52" y="481" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">anyone, an MCP client,</text><text x="52" y="497" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">or the importer</text><text x="52" y="513" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">never confirmed by itself</text><rect x="400" y="440" width="250" height="90" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="412" y="462" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Verification</text><text x="412" y="481" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">source reliability and</text><text x="412" y="497" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">information credibility,</text><text x="412" y="513" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">what it was checked against</text><rect x="760" y="440" width="200" height="90" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="772" y="462" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Confirmed</text><text x="772" y="481" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">only by an analyst</text><rect x="1000" y="440" width="200" height="90" rx="6" fill="#10243A" stroke="#EF4444" stroke-width="1.5"/><text x="1012" y="462" font-size="13" fill="#EF4444" text-anchor="start" font-weight="700">Refuted</text><text x="1012" y="481" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">kept, with the reason</text><path d="M290 485 L400 485" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M650 485 L760 485" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="705.0" y="478.0" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">analyst</text><path d="M560 440 L560 425 L1100 425 L1100 440" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#er)"/><text x="980" y="418" font-size="10.5" fill="#EF4444" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">not borne out</text><text x="620" y="556" font-size="11" fill="#8FA3B8" text-anchor="middle" font-weight="400">every update carries an assessment, in PHIA probability terms</text></svg>
