<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" font-family="'JetBrains Mono','Courier New',monospace"><defs><marker id="et" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00D4AA"/></marker><marker id="st" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#00D4AA"/></marker><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#F59E0B"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#EF4444"/></marker></defs><rect width="1240" height="360" fill="#0D1B2A"/><text x="620.0" y="34" font-size="18" fill="#00D4AA" text-anchor="middle" font-weight="700">Ostraka · MCP at /mcp</text><rect x="30" y="90" width="210" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="42" y="112" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">MCP client</text><text x="42" y="131" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">POST /mcp</text><text x="42" y="147" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">Bearer ost_…</text><rect x="272" y="90" width="210" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="284" y="112" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Token check</text><text x="284" y="131" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">an API token, never</text><text x="284" y="147" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">a browser JWT</text><path d="M240 130 L272 130" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><rect x="514" y="90" width="210" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="526" y="112" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Tools offered</text><text x="526" y="131" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">read-only token:</text><text x="526" y="147" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">read tools only</text><path d="M482 130 L514 130" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><rect x="756" y="90" width="210" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="768" y="112" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Tool call</text><text x="768" y="131" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">e.g. get_record</text><text x="768" y="147" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">OST-2026-014</text><path d="M724 130 L756 130" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><rect x="998" y="90" width="210" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="1010" y="112" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">ostraka's own API</text><text x="1010" y="131" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">in-process (ASGI)</text><text x="1010" y="147" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">as the token's owner</text><path d="M966 130 L998 130" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><rect x="272" y="230" width="210" height="80" rx="6" fill="#10243A" stroke="#EF4444" stroke-width="1.5"/><text x="284" y="252" font-size="13" fill="#EF4444" text-anchor="start" font-weight="700">401</text><text x="284" y="271" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">no token, a JWT,</text><text x="284" y="287" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">or an unknown one</text><path d="M377 170 L377 230" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#er)"/><text x="410" y="193.0" font-size="10.5" fill="#EF4444" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">refused</text><rect x="756" y="230" width="210" height="90" rx="6" fill="#10243A" stroke="#EF4444" stroke-width="1.5"/><text x="768" y="252" font-size="13" fill="#EF4444" text-anchor="start" font-weight="700">TLP:RED</text><text x="768" y="271" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">AMBER+STRICT too:</text><text x="768" y="287" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">reference only;</text><text x="768" y="303" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">open it in ostraka</text><rect x="998" y="230" width="212" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="1010" y="252" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Result</text><text x="1010" y="271" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">what the owner sees,</text><text x="1010" y="287" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">indicators masked as for them</text><path d="M1103 170 L1103 230" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M1030 170 L1030 200 L861 200 L861 230" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#er)"/><text x="945" y="194" font-size="10.5" fill="#EF4444" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">restricted record</text><text x="620" y="342" font-size="11" fill="#8FA3B8" text-anchor="middle" font-weight="400">add_comment and add_lead need a full token; a lead is never confirmed</text></svg>
