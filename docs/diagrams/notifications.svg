<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" font-family="'JetBrains Mono','Courier New',monospace"><defs><marker id="et" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#00D4AA"/></marker><marker id="st" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#00D4AA"/></marker><marker id="ea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#F59E0B"/></marker><marker id="er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#EF4444"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#EF4444"/></marker></defs><rect width="1240" height="590" fill="#0D1B2A"/><text x="620.0" y="34" font-size="18" fill="#00D4AA" text-anchor="middle" font-weight="700">Ostraka · notifications and nudges</text><rect x="30" y="80" width="210" height="92" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="42" y="102" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">A change</text><text x="42" y="121" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">an API request:</text><text x="42" y="137" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">task, finding, comment,</text><text x="42" y="153" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">phase, mention</text><rect x="275" y="80" width="230" height="92" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="287" y="102" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">One transaction</text><text x="287" y="121" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">activity event (hash chain)</text><text x="287" y="137" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">notification rows</text><text x="287" y="153" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">version bump</text><rect x="540" y="80" width="200" height="92" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="552" y="102" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Commit</text><text x="552" y="121" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">activity.finish</text><text x="552" y="137" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">→ notify.dispatch</text><rect x="775" y="70" width="430" height="112" rx="6" fill="#10243A" stroke="#F59E0B" stroke-width="1.5"/><text x="787" y="92" font-size="13" fill="#F59E0B" text-anchor="start" font-weight="700">notify.outward</text><text x="787" y="111" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">indicators masked in every message</text><text x="787" y="127" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">TLP:RED / AMBER+STRICT: the reference and</text><text x="787" y="143" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">the kind of event only</text><text x="787" y="159" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">a link back into ostraka</text><path d="M240 126 L275 126" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M505 126 L540 126" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><path d="M740 126 L775 126" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><rect x="30" y="250" width="270" height="80" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="42" y="272" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">In ostraka</text><text x="42" y="291" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">the bell, live over Redis</text><text x="42" y="307" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">(what changed, not content)</text><path d="M990 182 L990 215 L165 215 L165 250" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><rect x="330" y="250" width="270" height="80" rx="6" fill="#10243A" stroke="#F59E0B" stroke-width="1.5"/><text x="342" y="272" font-size="13" fill="#F59E0B" text-anchor="start" font-weight="700">Browser push</text><text x="342" y="291" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">Web Push, encrypted</text><text x="342" y="307" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">per subscription</text><path d="M990 182 L990 215 L465 215 L465 250" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#ea)"/><rect x="630" y="250" width="270" height="80" rx="6" fill="#10243A" stroke="#F59E0B" stroke-width="1.5"/><text x="642" y="272" font-size="13" fill="#F59E0B" text-anchor="start" font-weight="700">Email</text><text x="642" y="291" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">SMTP or Graph</text><text x="642" y="307" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">one sending mailbox</text><path d="M990 182 L990 215 L765 215 L765 250" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#ea)"/><rect x="930" y="250" width="270" height="80" rx="6" fill="#10243A" stroke="#F59E0B" stroke-width="1.5"/><text x="942" y="272" font-size="13" fill="#F59E0B" text-anchor="start" font-weight="700">Teams channel</text><text x="942" y="291" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">the team's webhook</text><text x="942" y="307" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">an Adaptive Card</text><path d="M990 182 L990 215 L1065 215 L1065 250" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#ea)"/><rect x="20" y="360" width="1200" height="145" rx="10" fill="none" stroke="#00D4AA" stroke-opacity="0.3" stroke-width="1"/><text x="34" y="382" font-size="12" fill="#8FA3B8" text-anchor="start" font-weight="700">the scheduler · one process per tick, by advisory lock</text><rect x="40" y="400" width="240" height="85" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="52" y="422" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Task due</text><text x="52" y="441" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">owner: a person, or</text><text x="52" y="457" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">the team's queue</text><rect x="335" y="400" width="240" height="85" rx="6" fill="#10243A" stroke="#00D4AA" stroke-width="1.5"/><text x="347" y="422" font-size="13" fill="#00D4AA" text-anchor="start" font-weight="700">Reminder</text><text x="347" y="441" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">to the owner, or the</text><text x="347" y="457" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">team in ostraka and Teams</text><path d="M280 442 L335 442" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#et)"/><text x="307.5" y="435.0" font-size="10.5" fill="#00D4AA" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">due</text><rect x="630" y="400" width="240" height="85" rx="6" fill="#10243A" stroke="#EF4444" stroke-width="1.5"/><text x="642" y="422" font-size="13" fill="#EF4444" text-anchor="start" font-weight="700">Escalate</text><text x="642" y="441" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">to the team lead</text><path d="M575 442 L630 442" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#er)"/><text x="602.5" y="435.0" font-size="10.5" fill="#EF4444" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">overdue</text><rect x="925" y="400" width="240" height="85" rx="6" fill="#10243A" stroke="#EF4444" stroke-width="1.5"/><text x="937" y="422" font-size="13" fill="#EF4444" text-anchor="start" font-weight="700">Escalate again</text><text x="937" y="441" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="400">to the incident commander</text><path d="M870 442 L925 442" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#er)"/><text x="897.5" y="435.0" font-size="10.5" fill="#EF4444" text-anchor="middle" paint-order="stroke" stroke="#0D1B2A" stroke-width="4">still</text><line x1="40" y1="530" x2="68" y2="530" stroke="#00D4AA" stroke-width="2"/><text x="76" y="534" font-size="11" fill="#8FA3B8" text-anchor="start" font-weight="400">inside ostraka</text><line x1="40" y1="548" x2="68" y2="548" stroke="#F59E0B" stroke-width="2"/><text x="76" y="552" font-size="11" fill="#8FA3B8" text-anchor="start" font-weight="400">leaves ostraka, cut down first</text><line x1="40" y1="566" x2="68" y2="566" stroke="#EF4444" stroke-width="2"/><text x="76" y="570" font-size="11" fill="#8FA3B8" text-anchor="start" font-weight="400">overdue</text></svg>
