[project]
name = "ostraka"
version = "0.1.0"
description = "Platform for Incident Management, Response and Hunting"
requires-python = ">=3.12"
license = {text = "Elastic-2.0"}
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.7.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "redis==5.2.1",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "pyotp==2.9.0",
  "cryptography==50.0.2",
  "segno==1.6.1",
  "email-validator==2.2.0",
  "httpx==0.28.1",
  # The suite's shared wire formats: licences, signed webhooks, STIX, MISP and Navigator layers
  "samarkand==0.2.1",
  # The MCP server at /mcp; sse-starlette 3.x works with Starlette 1.x, which FastAPI now uses
  "mcp==1.30.0",
  "sse-starlette==3.7.0",
  # Branded reports (ostraka.reports), at Shikari's pins where it has them
  "python-docx==1.1.2",  # the Word report
  "reportlab==4.2.5",  # the PDF report, with Inter and JetBrains Mono embedded
  "Pillow==13.0.0",  # charts, the cover art and cleaning uploaded logos
]

[project.scripts]
ostraka = "ostraka.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.8.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ostraka*"]

[tool.setuptools.package-data]
"ostraka.samples" = ["*.json"]
"ostraka.reports" = ["*.json", "fonts/*", "brand/*.png"]
"ostraka.legal" = ["*.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a Postgres database (OSTRAKA_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures use fixed throwaway passwords
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Cookie", "fastapi.Query"]
