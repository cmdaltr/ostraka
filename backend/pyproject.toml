[project]
name = "ostraka"
version = "0.1.0"
description = "Incident management and response for teams"
requires-python = ">=3.12"
license = {text = "Elastic-2.0"}
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.7.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "redis==5.2.1",
  "argon2-cffi==25.1.0",
  "pyjwt==2.10.1",
  "pyotp==2.9.0",
  "cryptography==44.0.0",
  "segno==1.6.1",
  "email-validator==2.2.0",
  "httpx==0.28.1",
  # The suite's shared wire formats: licences, signed webhooks, STIX, MISP and Navigator layers
  "samarkand==0.1.1",
  # The MCP server at /mcp; sse-starlette 2.x keeps starlette at FastAPI's pin
  "mcp==1.30.0",
  "sse-starlette==2.4.1",
  # Branded reports (ostraka.reports), at Shikari's pins where it has them
  "python-docx==1.1.2",  # the Word report
  "reportlab==4.2.5",  # the PDF report, with Inter and JetBrains Mono embedded
  "Pillow==11.3.0",  # charts and the cover art; the last 11.x, wheels for Python 3.12 and 3.13
]

[project.scripts]
ostraka = "ostraka.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "ruff==0.8.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ostraka*"]

[tool.setuptools.package-data]
"ostraka.samples" = ["*.json"]
"ostraka.reports" = ["*.json", "fonts/*", "brand/*.png"]
"ostraka.legal" = ["*.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a Postgres database (OSTRAKA_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures use fixed throwaway passwords
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Cookie", "fastapi.Query"]
